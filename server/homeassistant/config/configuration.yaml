default_config:

mqtt:
  sensor:
    - name: "Node01 Temperature"
      unique_id: eldercare_node01_temperature
      state_topic: "eldercare/node01/status"
      value_template: "{{ value_json.temperature }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: &node01_device
        identifiers:
          - "eldercare_node01"
        name: "Eldercare Node01"
        manufacturer: "STM32 Caring System"
        model: "STM32 + ESP8266 Gateway"

    - name: "Node01 Humidity"
      unique_id: eldercare_node01_humidity
      state_topic: "eldercare/node01/status"
      value_template: "{{ value_json.humidity }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      device: *node01_device

    - name: "Node01 Gas"
      unique_id: eldercare_node01_gas
      state_topic: "eldercare/node01/status"
      value_template: "{{ value_json.gas }}"
      state_class: measurement
      device: *node01_device

    - name: "Node01 Presence"
      unique_id: eldercare_node01_presence
      state_topic: "eldercare/node01/status"
      value_template: "{{ value_json.presence }}"
      device: *node01_device

    - name: "Node01 Risk"
      unique_id: eldercare_node01_risk
      state_topic: "eldercare/node01/status"
      value_template: "{{ value_json.risk }}"
      device: *node01_device

    - name: "Node01 Event"
      unique_id: eldercare_node01_event
      state_topic: "eldercare/node01/status"
      value_template: "{{ value_json.event }}"
      device: *node01_device

    - name: "Node01 Cloud Risk"
      unique_id: eldercare_node01_cloud_risk
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ value_json.cloud_risk }}"
      device: *node01_device

    - name: "Node01 Risk Score"
      unique_id: eldercare_node01_risk_score
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ value_json.risk_score }}"
      state_class: measurement
      device: *node01_device

    - name: "Node01 Analysis Summary"
      unique_id: eldercare_node01_analysis_summary
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ value_json.summary }}"
      device: *node01_device

    - name: "Node01 Analysis Model Used"
      unique_id: eldercare_node01_analysis_model_used
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ value_json.model_used }}"
      device: *node01_device

  binary_sensor:
    - name: "Node01 Need Family Notice"
      unique_id: eldercare_node01_need_family_notice
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ 'ON' if value_json.need_family_notice else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device: *node01_device

    - name: "Node01 Need Community Notice"
      unique_id: eldercare_node01_need_community_notice
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ 'ON' if value_json.need_community_notice else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device: *node01_device

    - name: "Node01 Need Hospital Notice"
      unique_id: eldercare_node01_need_hospital_notice
      state_topic: "eldercare/node01/analysis"
      value_template: "{{ 'ON' if value_json.need_hospital_notice else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device: *node01_device

  switch:
    - name: "Node01 Relay 1"
      unique_id: eldercare_node01_relay_1
      command_topic: "eldercare/node01/relay/1/set"
      state_topic: "eldercare/node01/relay/1/state"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      value_template: "{{ value_json.state }}"
      device: *node01_device

    - name: "Node01 Relay 2"
      unique_id: eldercare_node01_relay_2
      command_topic: "eldercare/node01/relay/2/set"
      state_topic: "eldercare/node01/relay/2/state"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      value_template: "{{ value_json.state }}"
      device: *node01_device

    - name: "Node01 Relay 3"
      unique_id: eldercare_node01_relay_3
      command_topic: "eldercare/node01/relay/3/set"
      state_topic: "eldercare/node01/relay/3/state"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      value_template: "{{ value_json.state }}"
      device: *node01_device

    - name: "Node01 Relay 4"
      unique_id: eldercare_node01_relay_4
      command_topic: "eldercare/node01/relay/4/set"
      state_topic: "eldercare/node01/relay/4/state"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      value_template: "{{ value_json.state }}"
      device: *node01_device
